# Local test routes: every service behind the one UI origin (http://localhost:5173).
# Mounted only by docker-compose.yml (dev/test). docker-compose.prod.yml removes this file,
# because the services trust internal headers (X-User-Id) and must never be public.

location /api/chat/ {
    set $upstream_chat http://chat-service:8001;  # re-resolved (see resolver in nginx.conf)
    rewrite ^/api/chat/(.*)$ /$1 break;
    proxy_pass $upstream_chat;
    proxy_set_header X-Forwarded-Prefix /api/chat;
    proxy_buffering off;              # server-sent events (/chat/stream)
    proxy_read_timeout 300s;
}
location /api/catalog/ {
    set $upstream_catalog http://catalog-service:8002;  # re-resolved (see resolver in nginx.conf)
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass $upstream_catalog;
    proxy_set_header X-Forwarded-Prefix /api/catalog;
}
location /api/orders/ {
    set $upstream_orders http://order-service:8003;  # re-resolved (see resolver in nginx.conf)
    rewrite ^/api/orders/(.*)$ /$1 break;
    proxy_pass $upstream_orders;
    proxy_set_header X-Forwarded-Prefix /api/orders;
}
location /api/gateway/ {
    set $upstream_gateway http://gateway:8000;  # re-resolved (see resolver in nginx.conf)
    rewrite ^/api/gateway/(.*)$ /$1 break;
    proxy_pass $upstream_gateway;
    proxy_set_header X-Forwarded-Prefix /api/gateway;
}
