[project]
name = "shopbot"
version = "0.1.0"
description = "E-commerce AI support chatbot (RAG) built as a target system for AI test automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "strawberry-graphql[fastapi]>=0.250",
    "faker>=33.0",
    "langchain-core>=1.6.4",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.14.0",
    "prometheus-client>=0.26.0",
    "langfuse>=4.15.4",
    "langchain>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
