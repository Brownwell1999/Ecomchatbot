# Production override for a public deployment. Pick how visitors reach it with a profile:
#   --profile https   Caddy on 80/443 with automatic HTTPS (a server with a domain: ./deploy.sh)
#   --profile tunnel  Cloudflare quick tunnel, no open ports or domain needed (./tunnel.sh)
# Either way, every other service is internal-only.

x-internal: &internal
  ports: !reset []
  restart: unless-stopped

x-app: &app
  <<: *internal
  environment:
    APP_ENV: prod  # hides debug data, GraphiQL and /eval/* endpoints
    DEMO_MODE: ${DEMO_MODE:-true}  # keep the demo-account picker for visitors
    RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-10}
    RATE_LIMIT_PER_DAY: ${PUBLIC_RATE_LIMIT_PER_DAY:-100}  # protects the Groq free quota
    CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}

services:
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    depends_on: [frontend]

  gateway: *app
  chat-service: *app
  catalog-service: *app
  order-service: *app
  frontend:
    <<: *internal
    volumes: !reset []  # no internal-API test routes in production
  postgres: *internal
  redis: *internal
  ollama: *internal
  prometheus: *internal
  # Grafana stays private: http://localhost:3000 on the host (or via an SSH tunnel)
  grafana:
    <<: *internal
    ports: !override ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

volumes:
  caddy_data:
