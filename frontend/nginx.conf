server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved every 10 s. With a variable in proxy_pass nginx looks the service
    # up per request instead of once at start-up, so a restarted gateway (new IP) never gives 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /graphql {
        set $gateway http://gateway:8000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;       # websocket (streaming, Phase 5)
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Local test routes (/api/chat/, /api/catalog/, …), mounted in dev/test only
    include /etc/nginx/dev-routes/*.conf;

    location / {
        try_files $uri /index.html;
    }
}
